# Dependabot configuration.
#
# Every ecosystem entry points at a directory that owns a lockfile. There is
# deliberately NO npm entry for the repository root: the root package.json is a
# private workspace manifest with no dependencies and no package-lock.json, and
# an entry there made Dependabot open lockfile-less duplicates of the
# per-workspace updates (for example #37, #38, #55), which can never pass the
# "Node.js 24 workspaces" gate. Each workspace below is grouped so one PR per
# workspace per week is the steady state.
version: 2
updates:
  # Go modules (single go.work module at the repo root).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # JavaScript workspaces: one entry per workspace that owns a package-lock.json.
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      web-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/apps/aether-demo"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      demo-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/sdk/typescript"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      sdk-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions — keep the SHA-pinned workflow actions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # Container base images used by the local/dev compose stack.
  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
