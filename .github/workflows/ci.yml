name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test --workspaces --if-present
      - run: npm run build --workspaces --if-present

  acceptance:
    runs-on: ubuntu-latest
    needs: [go, javascript]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/acceptance.mjs --strict

