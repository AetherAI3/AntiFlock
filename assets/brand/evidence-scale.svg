<svg viewBox="0 0 900 190" width="900" height="190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AntiFl0ck evidence scale: every claim is labeled DETECTED, VERIFIED, REPORTED, INFERRED, SUSPECTED, or UNKNOWN">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", -apple-system, Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="conf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.45" stop-color="#9fb8bd"/>
      <stop offset="1" stop-color="#43555c"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="188" rx="14" fill="#0d1519" stroke="#22343a" stroke-width="1.5"/>
  <text x="30" y="40" class="mono" font-size="12" fill="#5d7680" letter-spacing="1.5">EVERY CLAIM CARRIES ITS CONFIDENCE</text>

  <!-- confidence spectrum -->
  <rect x="30" y="96" width="840" height="3" rx="1.5" fill="url(#conf)" opacity="0.6"/>
  <text x="30" y="128" class="mono" font-size="10.5" fill="#5d7680">seen on your device</text>
  <text x="870" y="128" class="mono" font-size="10.5" fill="#5d7680" text-anchor="end">not enough information</text>

  <!-- chips -->
  <g class="mono" font-size="12.5" text-anchor="middle">
    <rect x="30"  y="60" width="112" height="26" rx="13" fill="#0f2b26" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="86"  y="78" fill="#2dd4bf" font-weight="600">DETECTED</text>

    <rect x="176" y="60" width="112" height="26" rx="13" fill="#123430" stroke="#2dd4bf" stroke-width="2.2"/>
    <text x="232" y="78" fill="#5ce8d5" font-weight="600">VERIFIED</text>

    <rect x="322" y="60" width="112" height="26" rx="13" fill="none" stroke="#9fb8bd" stroke-width="1.4"/>
    <text x="378" y="78" fill="#9fb8bd">REPORTED</text>

    <rect x="468" y="60" width="112" height="26" rx="13" fill="none" stroke="#c9a35c" stroke-width="1.4"/>
    <text x="524" y="78" fill="#c9a35c">INFERRED</text>

    <rect x="614" y="60" width="112" height="26" rx="13" fill="none" stroke="#b07a4f" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="670" y="78" fill="#b07a4f">SUSPECTED</text>

    <rect x="760" y="60" width="110" height="26" rx="13" fill="none" stroke="#43555c" stroke-width="1.4" stroke-dasharray="2 5"/>
    <text x="815" y="78" fill="#6b7f86">UNKNOWN</text>
  </g>

  <text x="450" y="166" class="sans" font-size="16" fill="#c7d6da" text-anchor="middle" font-style="italic">A guess never quietly becomes an accusation.</text>
</svg>
