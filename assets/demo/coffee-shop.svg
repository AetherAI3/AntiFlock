<svg viewBox="0 0 860 470" width="860" height="470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AntiFl0ck coffee-shop lab: untrusted network joins, sensitive action is held, route verifies, action is allowed, audit is signed">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", -apple-system, Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e171b"/>
      <stop offset="1" stop-color="#0a1114"/>
    </linearGradient>
    <linearGradient id="tealline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#55b3a4"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="1.5" y="1.5" width="857" height="467" rx="14" fill="url(#cardbg)" stroke="#22343a" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="26" cy="26" r="5.5" fill="#e06a5a" opacity="0.85"/>
  <circle cx="46" cy="26" r="5.5" fill="#e0a84e" opacity="0.85"/>
  <circle cx="66" cy="26" r="5.5" fill="#2dd4bf" opacity="0.85"/>
  <text x="88" y="31" class="mono" font-size="13" fill="#7b939b">antifl0ck · coffee-shop lab</text>
  <rect x="694" y="14" width="146" height="24" rx="12" fill="none" stroke="#2b3f46" stroke-width="1"/>
  <text x="767" y="30" class="mono" font-size="11.5" fill="#7b939b" text-anchor="middle">SIMULATION · LOCAL</text>
  <line x1="14" y1="48" x2="846" y2="48" stroke="#1b2a30" stroke-width="1"/>

  <!-- ROUTE PANEL -->
  <text x="30" y="78" class="mono" font-size="12" fill="#5d7680" letter-spacing="1.5">TRUSTED ROUTE</text>

  <!-- device node -->
  <circle cx="70" cy="120" r="17" fill="none" stroke="#9fb8bd" stroke-width="2"/>
  <rect x="62" y="112" width="16" height="12" rx="2" fill="none" stroke="#9fb8bd" stroke-width="1.6"/>
  <line x1="66" y1="128" x2="74" y2="128" stroke="#9fb8bd" stroke-width="1.6"/>
  <text x="70" y="155" class="mono" font-size="11.5" fill="#7b939b" text-anchor="middle">laptop-01</text>

  <!-- mesh gateway node -->
  <circle cx="420" cy="120" r="17" fill="none" stroke="#2dd4bf" stroke-width="2">
    <animate attributeName="stroke" dur="12s" repeatCount="indefinite"
      values="#2dd4bf;#2dd4bf;#e0a84e;#e0a84e;#2dd4bf;#2dd4bf"
      keyTimes="0;0.20;0.21;0.53;0.54;1"/>
  </circle>
  <path d="M412 120 l5 6 l11 -12" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
      values="1;1;0;0;1;1" keyTimes="0;0.20;0.21;0.53;0.54;1"/>
  </path>
  <text x="420" y="112" class="mono" font-size="13" fill="#e0a84e" text-anchor="middle" opacity="0">?
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.20;0.21;0.53;0.54;1"/>
  </text>
  <text x="420" y="155" class="mono" font-size="11.5" fill="#7b939b" text-anchor="middle">mesh-gw</text>

  <!-- core node -->
  <circle cx="770" cy="120" r="17" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <circle cx="770" cy="120" r="6" fill="#2dd4bf" opacity="0.9"/>
  <text x="770" y="155" class="mono" font-size="11.5" fill="#7b939b" text-anchor="middle">core</text>

  <!-- link 1: laptop -> mesh-gw (breaks) -->
  <line x1="92" y1="120" x2="398" y2="120" stroke="url(#tealline)" stroke-width="2.4">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
      values="1;1;0;0;1;1" keyTimes="0;0.20;0.21;0.53;0.54;1"/>
  </line>
  <line x1="92" y1="120" x2="398" y2="120" stroke="#e0a84e" stroke-width="2" stroke-dasharray="5 9" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
      values="0;0;0.9;0.9;0;0" keyTimes="0;0.20;0.21;0.53;0.54;1"/>
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <!-- link 2: mesh-gw -> core (stays) -->
  <line x1="442" y1="120" x2="748" y2="120" stroke="url(#tealline)" stroke-width="2.4"/>

  <!-- network banner -->
  <g>
    <rect x="30" y="176" width="380" height="30" rx="8" fill="#131d21" stroke="#22343a" stroke-width="1"/>
    <text x="44" y="196" class="mono" font-size="12.5" fill="#9fb8bd">wifi: home-mesh
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="1;1;0;0;1;1" keyTimes="0;0.20;0.21;0.53;0.54;1"/>
    </text>
    <text x="44" y="196" class="mono" font-size="12.5" fill="#e0a84e" opacity="0">wifi: cafe-open-wifi · UNTRUSTED
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.20;0.21;0.53;0.54;1"/>
    </text>
  </g>

  <!-- ACTION PANEL -->
  <g>
    <rect x="460" y="176" width="380" height="30" rx="8" fill="#131d21" stroke="#22343a" stroke-width="1"/>
    <text x="474" y="196" class="mono" font-size="12.5" fill="#9fb8bd">action: vault.export</text>
    <!-- state chip: IDLE -->
    <g opacity="1">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="1;1;0;0;1" keyTimes="0;0.27;0.28;0.97;1"/>
      <rect x="742" y="181" width="86" height="20" rx="10" fill="none" stroke="#5d7680" stroke-width="1.2"/>
      <text x="785" y="195" class="mono" font-size="11.5" fill="#7b939b" text-anchor="middle">IDLE</text>
    </g>
    <!-- state chip: HELD -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.27;0.28;0.62;0.63;1"/>
      <rect x="742" y="181" width="86" height="20" rx="10" fill="#2a2113" stroke="#e0a84e" stroke-width="1.4"/>
      <text x="785" y="195" class="mono" font-size="11.5" fill="#e0a84e" text-anchor="middle" font-weight="600">HELD</text>
    </g>
    <!-- state chip: ALLOWED -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.62;0.63;0.96;1"/>
      <rect x="742" y="181" width="86" height="20" rx="10" fill="#0f2b26" stroke="#2dd4bf" stroke-width="1.4"/>
      <text x="785" y="195" class="mono" font-size="11.5" fill="#2dd4bf" text-anchor="middle" font-weight="600">ALLOWED</text>
    </g>
  </g>

  <!-- AUDIT LOG -->
  <line x1="14" y1="226" x2="846" y2="226" stroke="#1b2a30" stroke-width="1"/>
  <text x="30" y="252" class="mono" font-size="12" fill="#5d7680" letter-spacing="1.5">SIGNED AUDIT LOG</text>

  <g class="mono" font-size="12.5" xml:space="preserve">
    <text x="30" y="282" fill="#e0a84e" opacity="0">event: net.join       cafe-open-wifi            [DETECTED]
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.21;0.22;0.96;1"/>
    </text>
    <text x="30" y="308" fill="#9fb8bd" opacity="0">event: action.request vault.export — needs trusted path
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.26;0.27;0.96;1"/>
    </text>
    <text x="30" y="334" fill="#e0a84e" opacity="0">event: policy.hold    no trusted route          [INFERRED]
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.29;0.30;0.96;1"/>
    </text>
    <text x="30" y="360" fill="#2dd4bf" opacity="0">event: route.verify   mesh-gw reachable         [VERIFIED]
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.53;0.54;0.96;1"/>
    </text>
    <text x="30" y="386" fill="#2dd4bf" opacity="0">event: action.allow   single-use grant · audit signed ✓
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.62;0.63;0.96;1"/>
    </text>
  </g>

  <!-- caption -->
  <line x1="14" y1="412" x2="846" y2="412" stroke="#1b2a30" stroke-width="1"/>
  <text x="30" y="440" class="sans" font-size="14" fill="#7b939b">When the trusted path disappears, the action waits. It runs only after the route is
    <tspan fill="#2dd4bf">verified</tspan> — and every step is <tspan fill="#2dd4bf">signed</tspan>.</text>
</svg>
