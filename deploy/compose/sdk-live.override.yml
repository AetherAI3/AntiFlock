services:
  sdk-loopback:
    profiles: ["sdk-live"]
    image: node:24.12.0-bookworm-slim@sha256:7326fb2dbdce998edd72140946851be64ef4a643e8715e138ca467e8e9d92c99
    command: ["node", "/opt/antiflock/sdk-loopback-proxy.mjs"]
    environment:
      ANTIFLOCK_PROXY_TARGET: http://172.30.0.10:8787
      ANTIFLOCK_PROXY_LISTEN: 0.0.0.0:18787
    volumes:
      - ./scripts/sdk-loopback-proxy.mjs:/opt/antiflock/sdk-loopback-proxy.mjs:ro
    ports:
      # The live SDK acceptance runs on the host and must exercise the SDK's
      # loopback-only HTTP boundary. The harness selects this temporary port.
      - "127.0.0.1:${ANTIFLOCK_SDK_E2E_PORT:?set by scripts/sdk-live-e2e.mjs}:18787"
    read_only: true
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    tmpfs:
      - /tmp:size=4m,mode=1777,noexec,nosuid,nodev
    depends_on:
      core:
        condition: service_healthy
    networks:
      - antiflock-demo
      - dashboard-host
