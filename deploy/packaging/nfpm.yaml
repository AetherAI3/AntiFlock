# nfpm (https://nfpm.goreleaser.com) package definition for antiflock-agent.
#
# Usage (from a release checkout, after building the agent with the flags in
# docs/release-policy.md):
#   VERSION=0.2.0 GOARCH=amd64 nfpm package -f deploy/packaging/nfpm.yaml -p deb -t dist/
#   VERSION=0.2.0 GOARCH=amd64 nfpm package -f deploy/packaging/nfpm.yaml -p rpm -t dist/
#
# The binary is expected at dist/antiflock-agent_${VERSION}_linux_${GOARCH}
# (the release artifact name). Packaging is not part of the release workflow
# yet; see docs/agent-lifecycle.md for the current status.
name: antiflock-agent
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: AntiFlock maintainers <security@antiflock.invalid>
description: |
  AntiFlock endpoint agent (observe mode).
  Read-only network metadata observer with signed, durable telemetry.
  Enforcement is not available in this package.
vendor: AntiFlock contributors
homepage: https://github.com/AetherAI3/AntiFlock
license: Apache-2.0

depends:
  - ca-certificates
recommends:
  - nftables
  - iproute2

contents:
  - src: ./dist/antiflock-agent_${VERSION}_linux_${GOARCH}
    dst: /usr/bin/antiflock-agent
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: ./deploy/systemd/antiflock-agent.service
    dst: /usr/lib/systemd/system/antiflock-agent.service
    file_info:
      mode: 0644
  - src: ./deploy/packaging/agent.example.yaml
    dst: /etc/antiflock/agent.example.yaml
    type: config|noreplace
    file_info:
      mode: 0644
  - src: ./docs/quickstart-linux.md
    dst: /usr/share/doc/antiflock-agent/quickstart-linux.md
  - src: ./docs/agent-lifecycle.md
    dst: /usr/share/doc/antiflock-agent/agent-lifecycle.md
  - src: ./docs/exit-codes.md
    dst: /usr/share/doc/antiflock-agent/exit-codes.md
  - dst: /var/lib/antiflock
    type: dir
    file_info:
      mode: 0700
      owner: antiflock
      group: antiflock

scripts:
  postinstall: ./deploy/packaging/postinstall.sh
  preremove: ./deploy/packaging/preremove.sh

deb:
  fields:
    Bugs: https://github.com/AetherAI3/AntiFlock/issues
rpm:
  summary: AntiFlock endpoint agent (observe mode)
