# antiflock-agent configuration (antiflock.agent-config/v1).
#
# Copy to /etc/antiflock/agent.yaml, or let `antiflock-agent init` write it.
# No secrets belong in this file: the node key is generated by `init` into
# stateDir, and the enrollment token is a private file passed to `enroll`.
schemaVersion: antiflock.agent-config/v1
nodeId: lab-node-1
displayName: Lab node
deploymentId: deploy-1
coreUrl: https://core.example.test:8787
stateDir: /var/lib/antiflock
queueDir: /var/lib/antiflock/queue
caCert: ""
interval: 30s
