version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/DBarr3/AntiFlock/api/gen/go
inputs:
  - directory: api/proto
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    revision: 1
    out: api/gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    revision: 1
    out: api/gen/go
    opt:
      - paths=source_relative
