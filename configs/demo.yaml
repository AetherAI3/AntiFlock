server:
  listen: 172.30.0.10:8787
  publicBaseURL: http://172.30.0.10:8787
  trustedProxies: []
  approvedBindCIDRs:
    - 172.30.0.0/24
  tlsCertFile: ""
  tlsKeyFile: ""

storage:
  path: /var/lib/antiflock/antiflock.db
  eventRetention: 336h
  auditRetention: 0s

identity:
  stateDirectory: /var/lib/antiflock/identity
  enrollmentTokenTTL: 10m

protection:
  telemetryStaleAfter: 2m
  requireMeshOnUntrustedNetworks: true
  failMode: closed
  allowOneTimeBypass: true
  oneTimeBypassTTL: 5m
  protectedActions:
    - nodeIds: ["*"]
      applicationIds: [aether-code]
      actionTypes: [git.push]
      dataClasses: [repository-source]
      sensitivities: [SENSITIVITY_OPERATOR_PRIVATE]
      allowedDestinations: [github.com]
      consentRequired: false
    - nodeIds: ["*"]
      applicationIds: [antiflock-nano]
      actionTypes: [scrambler.simulate]
      dataClasses: [network-control]
      sensitivities: [SENSITIVITY_OPERATOR_PRIVATE]
      allowedDestinations: [local://scrambler/simulation]
      consentRequired: true
    - nodeIds: ["*"]
      applicationIds: [antiflock-nano]
      actionTypes: [watchdog.public_surface.query]
      dataClasses: [owned-public-surface]
      sensitivities: [SENSITIVITY_OPERATOR_PRIVATE]
      allowedDestinations: [provider://fixture-shodan, provider://fixture-broker-registry, provider://fixture-paste-reference]
      consentRequired: true
    - nodeIds: ["*"]
      applicationIds: [antiflock-nano]
      actionTypes: [watchdog.countermeasure.plan]
      dataClasses: [owned-public-surface]
      sensitivities: [SENSITIVITY_OPERATOR_PRIVATE]
      allowedDestinations: [local://countermeasure/plan]
      consentRequired: true

telemetry:
  collectFlowMetadata: true
  collectPayloads: false

scrambler:
  executionEnabled: false
  simulationEnabled: true
